name: Go

on:
  push:
  pull_request:
  workflow_dispatch:

# least privilege: this workflow only needs to read the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # third party actions are pinned to full commit SHAs, tags are mutable. dependabot keeps them updated
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # known vulnerabilities in dependencies, limited to code that is actually called. exact version, like the actions
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: go build -v ./...

      # the engine tests in pkg/kiterunner need the bundled test server on ports 14000-15001.
      # without it they are skipped, so start it to actually exercise the scanner
      - name: Start test server
        run: |
          go build -o "$RUNNER_TEMP/testserver" ./cmd/testServer
          "$RUNNER_TEMP/testserver" -p=14000-15001 > "$RUNNER_TEMP/testserver.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:15000/ && exit 0
            sleep 1
          done
          echo "test server did not come up"; cat "$RUNNER_TEMP/testserver.log"; exit 1

      - name: Test
        run: go test -count=1 -timeout 5m ./...

      # KR_E2E_RACE builds the kr binary used by the e2e tests with the race detector as well
      - name: Test (race detector)
        env:
          KR_E2E_RACE: "1"
        run: go test -count=1 -race -timeout 15m ./...
