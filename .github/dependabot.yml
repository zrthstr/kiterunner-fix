version: 2
updates:
  # keeps the SHA-pinned actions in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # wait before proposing a new release: freshly published versions are when a hijacked package is live
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # wait before proposing a new release: freshly published versions are when a hijacked package is live
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
